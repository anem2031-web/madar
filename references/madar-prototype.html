:root {
  color-scheme: light;
  --ink: #344052;
  --muted: #566478;
  --paper: #fff;
  --bg: #e5ecff;
  --bg-end: #d6f7ff;
  --background-stop: 67%;
  --surface: #f4f7ff;
  --glass: #ffffff40;
  --card-glass: #ffffff57;
  --glass-line: #ffffffd9;
  --line: #dce3f0;
  --line-strong: #bbc8df;
  --field-line: #8493ad;
  --field-ink: #495c7b;
  --brand: #087b7a;
  --brand-dark: #006362;
  --accent-soft: #dbf2f1;
  --nav: #e9efff;
  --nav-soft: #dae5fb;
  --selected: #2a303b;
  --selected-text: #f9fafa;
  --overlay: #232e4680;
  --rail-width: 76px;
  --radius: 22px;
  --pill: 2rem;
  --shadow: 0 3px 14px #2b3d5e0d;
  --type-title: 16px;
  --type-section: 11.5px;
  --type-copy: 12px;
  --type-control: 10.5px;
  --type-field: 12px;
  --type-detail: 10px;
  --type-metric: 13px;
  font-family: Almarai, "Segoe UI", Tahoma, Arial, sans-serif;
  font-size: 16px;
  font-weight: 400;
}
* { box-sizing: border-box; }
body { margin: 0; background: linear-gradient(180deg, var(--bg) var(--background-stop), var(--bg-end)) fixed; color: var(--ink); font-size: var(--type-copy); line-height: 1.55; }
:where(h1, h2, h3, h4, h5, h6, b, strong, th, optgroup) { font-weight: inherit; }
body:has(.approvals) { --background-stop: 54%; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: var(--brand-dark); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--brand); outline-offset: 2px;
}
[hidden] { display: none !important; }
button:disabled { opacity: .48; cursor: not-allowed; }
h1, h2, h3, p { margin: 0; }
.skip-link { position: fixed; z-index: 10; inset: 12px 12px auto auto; padding: 10px; background: white; transform: translateY(-160%); }
.skip-link:focus { transform: none; }
.app { display: grid; grid-template-columns: var(--rail-width) minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; z-index: 4; top: 0; justify-self: start; inline-size: var(--rail-width); height: 100dvh; display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 13px 12px 10px; color: var(--ink); background: var(--nav); border-inline-end: 1px solid var(--line); }
.brand { display: flex; gap: 10px; align-items: center; text-align: start; color: var(--ink); background: none; border: 0; margin: 0; padding: 2px 5px 6px; }
.brand-mark { position: relative; height: 41px; width: 41px; border-radius: 13px; display: grid; place-items: center; background: var(--accent-soft); color: var(--brand-dark); flex: 0 0 auto; }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; border-radius: 50%; border: 2px solid currentColor; width: 24px; height: 13px; transform: rotate(-33deg); }
.brand-mark::after { transform: rotate(33deg); }
.brand-mark i { width: 5px; height: 5px; background: currentColor; border-radius: 50%; }
.brand-copy, .nav-label, .nav-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-copy strong { display: block; font-size: var(--type-title); line-height: 1.3; white-space: normal; }
.brand-copy small { display: block; font-size: var(--type-detail); color: var(--muted); margin-top: 4px; }
#navigation { display: flex; flex: 1; min-height: 0; flex-direction: column; }
.nav-main, .nav-bottom { display: grid; grid-template-columns: minmax(0,1fr); align-content: start; gap: 9px; padding: 3px; }
.nav-main { min-height: 0; overflow: hidden auto; overscroll-behavior: contain; scrollbar-width: none; }
.sidebar:is(:hover, :has(:focus-visible)) .nav-main { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.nav-bottom { margin-top: auto; border-top: 1px solid var(--line); }
.nav-group { display: grid; grid-template-columns: minmax(0,1fr); gap: 3px; }
.nav-group + .nav-group { border-top: 1px solid var(--line); padding-top: 8px; }
.nav-label { padding: 1px 9px 3px; color: var(--muted); font-size: var(--type-detail); }
.nav-link { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 2px 4px; border-radius: var(--pill); border: 1px solid transparent; text-align: start; background: none; color: var(--ink); font-size: var(--type-control); }
.nav-emblem { display: grid; place-items: center; flex: 0 0 34px; height: 34px; border-radius: 50%; }
.nav-link[data-section] .nav-title { margin-inline-end: 20px; }
.nav-chevron { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); display: grid; place-items: center; color: var(--muted); pointer-events: none; }
.nav-chevron .glyph { width: 13px; height: 13px; }
.nav-link:hover, .nav-link[aria-expanded="true"] { background: var(--nav-soft); }
.nav-link[aria-expanded="true"] { border-color: var(--line-strong); }
.nav-link[aria-current="page"] { background: var(--nav-soft); }
.nav-link[aria-current="page"] .nav-emblem { color: var(--selected-text); background: var(--selected); }
.section-menu { position: absolute; z-index: 3; inset-inline-start: 100%; inset-block: 8px; inline-size: min(318px, 46vw); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line-strong); border-block-start: 3px solid var(--brand); border-radius: var(--radius); background: var(--paper); box-shadow: 0 18px 48px #2b3d5e26; }
.section-menu-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 15px; background: var(--surface); border-bottom: 1px solid var(--line); }
.section-menu-head h2 { font-size: var(--type-section); }
.section-menu-head .icon-button { width: 33px; height: 33px; }
.section-links { min-height: 0; padding: 10px 12px 16px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.section-group + .section-group { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
.section-group h3 { display: flex; align-items: center; gap: 7px; padding: 0 7px 4px; color: var(--brand-dark); font-size: var(--type-section); }
.section-group h3 .glyph { width: 16px; height: 16px; }
.section-link { display: flex; align-items: center; gap: 7px; padding: 7px 8px; min-height: 38px; text-align: start; text-decoration: none; color: var(--ink); border: 1px solid transparent; border-radius: 9px; font-size: var(--type-control); }
.section-link:hover, .section-link[aria-current="page"] { background: var(--surface); border-color: var(--line); }
.section-link[aria-current="page"] { border-inline-start: 3px solid var(--brand); }
.section-link > .glyph { margin-inline-start: auto; width: 13px; height: 13px; color: var(--muted); }
.avatar { display: inline-grid; place-items: center; flex: 0 0 auto; width: 35px; height: 35px; border-radius: 50%; color: #3e527d; background: var(--nav-soft); font-size: var(--type-detail); }
.workspace { min-width: 0; display: flex; flex-direction: column; }
.topbar { min-height: 67px; padding: 10px clamp(15px, 3.1vw, 42px); display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--glass); border-bottom: 1px solid var(--line); }
.topbar-context, .topbar-actions { display: flex; align-items: center; gap: 12px; }
.topbar-context strong { font-size: var(--type-copy); display: block; }
.topbar-context small { color: var(--muted); font-size: var(--type-detail); display: block; }
.context-icon { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; color: var(--brand); }
.top-search { display: flex; align-items: center; gap: 9px; padding: 8px 13px; min-height: 40px; min-width: 205px; border: 1px solid var(--line); border-radius: var(--pill); color: var(--field-ink); background: var(--paper); font-size: var(--type-control); text-align: start; }
kbd { display: inline-block; margin-inline-start: auto; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: #535870; background: white; font-size: var(--type-detail); }
.icon-button { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; padding: 0; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); background: var(--paper); }
.icon-button:hover, .top-search:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface); }
.icon-action { width: 34px; height: 34px; }
.icon-action .glyph { width: 16px; height: 16px; }
.notify i { position: absolute; inset: 8px auto auto 9px; width: 7px; height: 7px; background: #ae4e30; border: 1px solid white; border-radius: 50%; }
.mobile-menu, .nav-backdrop { display: none; }
.glyph { display: inline-block; vertical-align: middle; width: 19px; height: 19px; flex: 0 0 auto; pointer-events: none; }
.glyph-image { display: block; width: 100%; height: 100%; background-color: currentColor; mask: var(--glyph-mask) center / contain no-repeat; }
.context-icon.glyph { display: grid; width: 38px; height: 38px; }
.context-icon.glyph .glyph-image { width: 19px; height: 19px; }
main { width: 100%; max-width: 1510px; margin: 0 auto; padding: 23px clamp(15px, 3.1vw, 42px) 34px; }
main:focus { outline: none; }
.footer { display: flex; justify-content: space-between; gap: 12px; padding: 14px clamp(15px, 3.1vw, 46px); border-top: 1px solid var(--line); margin-top: auto; color: var(--muted); font-size: var(--type-detail); }
.page-heading { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
.page-heading h1 { font-size: var(--type-title); line-height: 1.4; }
.page-heading p { color: var(--muted); font-size: var(--type-copy); margin-top: 6px; }
.branch-path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 9px; color: var(--muted); font-size: var(--type-detail); }
.branch-path .glyph { width: 13px; height: 13px; }
.button { display: inline-flex; gap: 7px; align-items: center; justify-content: center; padding: 8px 16px; min-height: 40px; border: 1px solid transparent; border-radius: var(--pill); text-decoration: none; background: var(--brand); color: #fff; font-size: var(--type-control); white-space: nowrap; }
.button:hover { background: var(--brand-dark); }
.button.secondary { color: var(--ink); background: white; border-color: var(--line); }
.button.secondary:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface); }
.button.danger { background: #ab3f49; }
.button.danger:hover { background: #852b34; }
.button.small { min-height: 34px; padding: 5px 12px; }
.tile-icon { display: inline-grid; place-items: center; flex: 0 0 auto; width: 35px; height: 35px; border-radius: 50%; color: #3e527d; background: var(--nav-soft); }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 18px 11px; }
.panel-head h2 { font-size: var(--type-section); }
.panel-head p { margin-top: 3px; color: var(--muted); font-size: var(--type-detail); }
.panel-body { padding: 5px 18px 17px; }
.panel + .panel.standalone { margin-top: 16px; }
.table-wrap { max-width: 100%; overflow: auto; }

.search-result:hover { background: var(--nav-soft); }
.toast { position: fixed; z-index: 9; inset: auto auto 18px 18px; max-width: calc(100vw - 36px); background: var(--selected); color: var(--selected-text); padding: 11px 15px; border-radius: 10px; box-shadow: 0 8px 24px #2b3d5e32; }
@media (max-width: 1120px) {
  th, td { padding-inline: 11px; }
}
@media (any-hover: hover) {
  .sidebar { transition: inline-size .2s ease; }
  .sidebar:is(:hover, :has(:focus-visible)) { inline-size: min(228px,48vw); box-shadow: -10px 0 28px #2b3d5e24; }
  .sidebar :is(.brand-copy, .nav-label, .nav-title, .nav-chevron) { opacity: 0; visibility: hidden; transition: opacity .12s ease, visibility 0s .12s; }
  .sidebar:is(:hover, :has(:focus-visible)) :is(.brand-copy, .nav-label, .nav-title, .nav-chevron) { opacity: 1; visibility: visible; transition-delay: .04s, 0s; }
  .sidebar:hover .brand-mark { animation: radman-mark-in 900ms cubic-bezier(.2,.75,.3,1) both; }
  .sidebar:hover .brand-copy strong { animation: radman-text-in 675ms ease-out 225ms both; }
  .sidebar:hover .brand-copy small { animation: radman-text-in 640ms ease-out 360ms both; }
}
@keyframes radman-mark-in {
  from { opacity: .78; transform: translateY(3px) scale(.94); }
  to { opacity: 1; transform: none; }
}
@keyframes radman-text-in {
  from { opacity: 0; transform: translateX(7px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .sidebar, .sidebar :is(.brand-copy, .nav-label, .nav-title, .nav-chevron) { transition: none; }
  .sidebar:hover :is(.brand-mark, .brand-copy strong, .brand-copy small) { animation: none; }
}
@media (width < 721px) {
  :root {
    --type-title: 18px;
    --type-section: 13px;
    --type-copy: 14px;
    --type-control: 12px;
    --type-field: 16px;
    --type-detail: 11px;
    --type-metric: 15px;
  }
}
@media (any-hover: none) {
  .app { display: block; }
  .sidebar { display: none; position: fixed; z-index: 6; inset: 0 0 0 auto; inline-size: min(270px,86vw); }
  body.nav-open .sidebar { display: flex; }
  body.nav-open .nav-backdrop { display: block; position: fixed; z-index: 5; inset: 0; width: 100%; height: 100%; border: none; background: var(--overlay); }
  .section-menu { inset-inline: 6px; inset-block: 8px; inline-size: auto; }
  .mobile-menu { display: inline-flex; gap: 6px; width: auto; padding-inline: 10px; border-radius: var(--pill); font-size: var(--type-control); }
  .context-icon.glyph { display: none; }
}
@media (max-width: 635px) {

  .topbar-actions { gap: 7px; }
  .top-search { min-width: 40px; width: 40px; justify-content: center; }
  .search-label, .top-search kbd, .top-avatar { display: none; }
  main { padding-top: 16px; }
  .report-layout, .mini-grid { grid-template-columns: minmax(0,1fr); }
  .page-heading { align-items: flex-start; flex-direction: column; }
  .form-grid { grid-template-columns: 1fr; }
  .footer { flex-wrap: wrap; }
}
@media (max-height: 680px) and (min-width: 721px) {
  .sidebar { gap: 7px; padding-block: 8px; }
  .nav-main, .nav-bottom { gap: 5px; }
  .nav-group + .nav-group { padding-top: 4px; }
  .nav-link { min-height: 35px; padding-block: 1px; }
  .nav-emblem { flex-basis: 32px; height: 31px; }
}

.approval-add > summary .glyph:last-child { width: 13px; height: 13px; }
.approval-menu-head { display: flex; justify-content: space-between; align-items: center; gap: 5px; margin-bottom: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: var(--type-section); }
.approval-menu-head .button { min-height: 27px; }
.approval-column-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.approval-column-item:last-child { border-bottom: 0; }
.approval-column-item label { display: flex; align-items: center; gap: 5px; padding: 3px 0; font-size: var(--type-control); }
.approval-column-item input { margin: 0; width: 15px; height: 15px; }
.approval-column-moves { display: flex; gap: 2px; }
.approval-column-moves .icon-action { width: 23px; height: 23px; }
.approval-column-moves .glyph { width: 12px; height: 12px; }
.approval-filter-menu { display: grid; gap: 7px; }
.approval-filter-menu .select select { max-width: none; }
.approval-filter-menu .field { font-size: var(--type-control); }
.approval-filter-menu input { min-height: 32px; }
.approval-table-wrap { border-top: 1px solid var(--line); }
.approval-table { min-width: 1000px; }
.approval-table th, .approval-table td { padding: 6px 10px; }
.approval-table th { background: transparent; }
.approval-table th[aria-sort] { box-shadow: inset 0 -2px var(--brand); color: var(--brand-dark); }
.approval-table th button { display: inline-flex; align-items: center; gap: 3px; padding: 2px 0; border: 0; background: transparent; color: inherit; font: inherit; }
.approval-table th .glyph { width: 13px; height: 13px; }
.approval-table tbody tr { background: var(--paper); }
.approval-table tbody tr:nth-child(even) { background: #fbfcfe; }
.approval-table tbody tr:hover { background: var(--surface); }
.approval-table .person .avatar { width: 27px; height: 27px; }
.approval-cell-reference, .approval-cell-employeeId, .approval-cell-submitted, .approval-cell-received { white-space: nowrap; font-variant-numeric: tabular-nums; }
.approval-cell-reference, .approval-cell-employeeId { direction: ltr; text-align: right; }
.approval-row-actions { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
.approval-table .button.small, .approval-row-actions .icon-action { min-height: 26px; height: 26px; }
.approval-row-actions .icon-action { width: 26px; }
.approval-row-actions .icon-action .glyph { width: 14px; height: 14px; }
.approval-row-actions [data-decision="approve"] { color: #17624e; border-color: #b5d6ca; }
.approval-row-actions [data-decision="reject"] { color: #9b3745; border-color: #e6c1c8; }

@media (max-width: 830px) {
  .approvals-layout, .approvals-layout.is-collapsed { grid-template-columns: minmax(0,1fr); }
  .approval-categories { display: flex; flex-wrap: wrap; max-height: 135px; overflow: auto; overscroll-behavior: contain; }
}
@media (max-width: 680px) {
  .approval-menu { position: fixed; z-index: 7; inset: auto 12px 12px; width: auto; max-width: none; max-height: min(390px, 55dvh); }
}
@media (max-width: 520px) {
  .approvals-heading .tabs { gap: 4px; }
  .approvals-heading .tab { padding-inline: 9px; }
  .approval-toolbar-main .search-field { flex: 1 1 100%; }
  .approval-filters select { max-width: 150px; }
}

function branchData(key) {
  if (Object.hasOwn(sampleBranchData, key)) return sampleBranchData[key];
  const reportType = { people: 'employees', salary: 'payroll', leave: 'requests' }[key];
  if (reportType) {
    const { headers, rows } = reportData(reportType);
    return [headers, rows];
  }
  const attendanceRows = (entries) => [['الموظف', 'اليوم', 'الدخول', 'الخروج', 'الحالة'],
    entries.map((row) => [personName(row.employee), row.date, row.in || '—', row.out || '—', row.status])];
  const letters = () => state.documents.filter((row) => String(row.kind ?? '').includes('خطاب'));
  const documentRows = (entries) => [['الوثيقة', 'الموظف', 'الفئة', 'الحالة'],
    entries.map((row) => [row.title, personName(row.employee), row.kind, row.status])];
  switch (key) {
    case 'organization': return [['القسم', 'إجمالي الموظفين', 'النشطون'], directories.map((department) => {
      const members = state.people.filter((person) => person.department === department);
      return [department, members.length, members.filter((person) => person.status === 'نشط').length];
    })];
    case 'onboarding': return [['المهمة', 'الموظف', 'التاريخ', 'الحالة'], state.tasks.filter((row) => /تهيئة|ترحيب/.test(row.title)).map((row) => [row.title, personName(row.employee), row.due, row.status])];
    case 'inactive': return [['الموظف', 'القسم', 'المسمى', 'الحالة'], state.people.filter((row) => row.status !== 'نشط').map((row) => [row.name, row.department, row.job, row.status])];
    case 'payslips': return [['الموظف', 'الشهر', 'الأساسي', 'صافي القسيمة'], state.payroll.filter((row) => row.employee === 'EMP-1001').map((row) => [personName(row.employee), row.month, formatMoney(row.base), formatMoney(row.net)])];
    case 'balances': return [['الموظف', 'القسم', 'الرصيد بالأيام'], state.people.map((row) => [row.name, row.department, row.balance])];
    case 'attendance': return attendanceRows(state.attendance);
    case 'daily': return attendanceRows(state.attendance.filter((row) => row.date === today));
    case 'missing': return attendanceRows(state.attendance.filter((row) => row.status === 'حضور' && (!row.in || !row.out)));
    case 'totals':
    case 'monthly': {
      const entries = key === 'monthly' ? state.attendance.filter((row) => row.date.startsWith(currentMonth)) : state.attendance;
      return [['الموظف', 'عدد الحركات', 'أيام الحضور', 'أيام الغياب'], state.people.map((person) => {
        const moves = entries.filter((row) => row.employee === person.id);
        return [person.name, moves.length, moves.filter((row) => row.status === 'حضور').length, moves.filter((row) => row.status === 'غياب').length];
      })];
    }
    case 'my-letters': return documentRows(letters().filter((row) => row.employee === 'EMP-1001'));
    case 'official-letters': return documentRows(letters());
    case 'document-categories': return [['الفئة', 'عدد الوثائق'], [...new Set(state.documents.map((row) => row.kind))].map((kind) => [kind, state.documents.filter((row) => row.kind === kind).length])];
    case 'evaluations': return [['الدورة', 'القسم', 'البداية', 'النهاية', 'الحالة'], state.performance.map((row) => [row.title, row.department, row.start, row.due, row.status])];
    case 'cycle-summary': return [['القسم', 'الدورات', 'المكتملة'], directories.map((department) => {
      const cycles = state.performance.filter((row) => row.department === department);
      return [department, cycles.length, cycles.filter((row) => row.status === 'مكتمل').length];
    })];
    default: throw new Error(`No dataset for ${key}`);
  }
}

function currentBranchRows(f) {
  const [headers, records] = branchData(currentBranch()[2]);
  const statusIndex = headers.indexOf('الحالة');
  const rows = records.map((record, index) => ({ record, index }))
    .filter(({ record }) => (!f.status || f.status === record[statusIndex]) && findMatches(f.q, ...record));
  const status = statusIndex < 0 ? [] : [...new Set(records.map((row) => row[statusIndex]))];
  return { headers, rows, status };
}

function homeBalances(f, self) {
  const approved = state.requests.filter((row) => row.employee === homeEmployeeId && row.status === 'معتمد');
  const elapsed = (row) => Math.max(0, daysBetween(row.start, row.end > f.balanceDay ? f.balanceDay : row.end));
  const sickUsed = approved.filter((row) => row.type === 'إجازة مرضية' && row.start.slice(0, 4) === f.balanceDay.slice(0, 4))
    .reduce((sum, row) => sum + elapsed(row), 0);
  const annualFuture = approved.filter((row) => row.type === 'إجازة سنوية')
    .reduce((sum, row) => sum + Math.max(0, row.amount - elapsed(row)), 0);
  const hoursUsed = approved.filter((row) => row.type === 'مغادرة قصيرة' && row.start <= f.balanceDay && row.start.slice(0, 7) === f.balanceDay.slice(0, 7))
    .reduce((sum, row) => sum + row.amount, 0);
  const balances = [
    ['إجازة سنوية', self ? self.balance + annualFuture : 0, 'يوم', 'calendar'],
    ['إجازة مرضية', Math.max(0, 30 - sickUsed), 'يوم', 'info'],
    ['مغادرة قصيرة', Math.max(0, 8 - hoursUsed), 'ساعة', 'clock'],
  ];
  return homeWidget('رصيد الإجازات', 'calendar', `
    <label class="home-balance-date"><span>الرصيد حتى</span>${input('balanceDay', f.balanceDay, 'date', 'data-filter="balanceDay" aria-label="تاريخ رصيد الإجازات" min="1900-01-01" max="2099-12-31" required')}</label>

    btn('طلب إجازة أو مغادرة', 'data-action="new-request"', 'home-link', 'plus'));
}

    if (approvalFamily(request) === 'leave' && request.status === 'معتمد' && request.type !== 'مغادرة قصيرة' && request.start <= today && today <= request.end) {

function homeBirthdays() {

  const upcoming = days.map(([id, monthDay]) => {
    const year = Number(today.slice(0, 4));
    const date = `${year + Number(monthDay < today.slice(5))}-${monthDay}`;
    return [id, date, daysBetween(today, date) - 1];
  }).filter(([, , offset]) => offset <= 30).sort((a, b) => a[2] - b[2]);

function homeCalendar(f, events) {
  const first = dateObject(`${f.calendarDay.slice(0, 7)}-01`);
  const year = first.getUTCFullYear(), month = first.getUTCMonth();
  const count = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  const marked = new Set(events.map((event) => event.date));
  const cells = [
    ...Array.from({ length: first.getUTCDay() }, () => '<span aria-hidden="true"></span>'),
    ...Array.from({ length: count }, (_, i) => {
      const day = i + 1, key = `${f.calendarDay.slice(0, 7)}-${String(day).padStart(2, '0')}`;
      const selected = key === f.calendarDay;
      const label = `${dateLabel(key)}${marked.has(key) ? '، توجد أحداث' : ''}`;
      return `<button type="button" data-action="home-calendar-day" data-value="${key}" aria-pressed="${selected}"
        ${key === today ? 'aria-current="date"' : ''} tabindex="${selected ? 0 : -1}" aria-label="${escape(label)}">
        ${number.format(day)}${marked.has(key) ? '<i aria-hidden="true"></i>' : ''}
      </button>`;
    }),
  ];
  const selectedEvents = events.filter((event) => event.date === f.calendarDay).sort((a, b) => a.start.localeCompare(b.start));
  const entries = selectedEvents.map((event) => homeItem(
    `<time class="home-event-time" datetime="${escape(event.start)}" dir="ltr">${escape(event.start)}</time>`,
    event.title, event.end ? `${event.start} – ${event.end}` : event.start,
    iconButton(`عرض حدث ${event.title}`, `data-action="home-event-detail" data-id="${event.id}"`, 'view')
  )).join('');
  return homeWidget('الأحداث', 'calendar', `
    <div class="home-calendar">
      <div class="home-calendar-head"><h3 aria-live="polite">${escape(homeMonth.format(first))}</h3>
        <div class="row-actions">
          ${iconButton('الشهر السابق', 'data-action="home-calendar-month" data-value="-1"', 'back')}
          ${iconButton('الشهر التالي', 'data-action="home-calendar-month" data-value="1"', 'next')}
        </div>
      </div>
      <div class="home-calendar-grid" aria-label="تقويم الشهر">
        ${homeWeek.map((label) => `<span class="home-weekday">${label}</span>`).join('')}${cells.join('')}
      </div>
    </div>
    <div class="home-agenda-head"><h3>${escape(dateLabel(f.calendarDay))}</h3>${f.calendarDay === today ? '' : btn('اليوم', 'data-action="home-calendar-today"', 'secondary small')}</div>
    <div aria-live="polite">${entries ? `<ul class="home-items">${entries}</ul>` : homeEmpty('calendar', 'لا توجد أحداث في هذا اليوم.')}</div>
    `, iconButton('إضافة حدث', 'data-action="home-new-event"', 'plus'), 'home-calendar-widget');

function moveHomeMonth(direction) {
  const first = dateObject(`${settingsObj().calendarDay.slice(0, 7)}-01`);
  const next = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + Number(direction), 1, 12));
  const date = dateKey.format(next);
  updateHomeCalendar(date.slice(0, 7) === currentMonth ? today : date,
    `[data-action="home-calendar-month"][data-value="${direction}"]`);
}

function handleHomeCalendarKey(event) {
  const button = event.target.closest?.('[data-action="home-calendar-day"]');
  const offsets = { ArrowRight: -1, ArrowLeft: 1, ArrowUp: -7, ArrowDown: 7 };
  if (!button || !Object.hasOwn(offsets, event.key)) return false;
  event.preventDefault();
  const date = dateObject(button.dataset.value);
  date.setUTCDate(date.getUTCDate() + offsets[event.key]);
  updateHomeCalendar(dateKey.format(date));
  return true;
}

  const isEvent = type === 'events';

  presentForm(isEvent ? 'إضافة حدث' : 'إضافة تعميم', 'يُحفظ في نموذج مدار حديقة الوطن على هذا المتصفح.', fields, 'حفظ', (data) => {

    if (isEvent && (!data.date || !data.start || (data.end && data.end < data.start))) return 'راجع تاريخ الحدث ووقتي البداية والنهاية.';

function approvalColumnState() {
  const available = Object.keys(approvalColumns).filter((id) => id !== 'actions');
  const selected = state.approvalColumns;
  const stored = Array.isArray(selected?.order) ? selected.order.filter((id) => available.includes(id)) : [];
  const order = [...new Set([...stored, ...available]), 'actions'];
  const storedHidden = Array.isArray(selected?.hidden) ? selected.hidden : available.filter((id) => approvalColumns[id].hidden);
  return { order, hidden: storedHidden.filter((id) => available.includes(id) && !approvalColumns[id].fixed) };
}

}

function scopedApprovalRows(f) {
  const self = getPerson('EMP-1001');
  const scope = f.requestScope;
  return state.requests.filter((request) => {
    if (scope === 'mine') return request.employee === self?.id;
    if (scope === 'manager') return Boolean(self) && request.employee !== self.id && getPerson(request.employee)?.department === self.department;
    return scope !== 'overrides' || request.status === 'قيد المراجعة' || Boolean(request.overrideReason);
  });
}

function matchingApprovals(f) {
  return scopedApprovalRows(f).filter((request) => {
    const employee = getPerson(request.employee);
    const submitted = approvalDay(submittedOn(request));
    return (!f.tab || request.status === f.tab) &&
      (!f.type || request.type === f.type) &&
      (!f.approvalFamily || approvalFamily(request) === f.approvalFamily) &&
      (!f.approvalEmployee || request.employee === f.approvalEmployee) &&
      (!f.approvalEmployeeState || employee?.status === f.approvalEmployeeState) &&
      (!f.approvalJob || employee?.job === f.approvalJob) &&
      (!f.approvalFlow || approvalFlow(request) === f.approvalFlow) &&
      (!f.approvalFrom || f.approvalFrom <= submitted) &&
      (!f.approvalUntil || submitted <= f.approvalUntil) &&
      (!f.approvalReceipt || approvalDay(receivedOn(request)) === f.approvalReceipt) &&
      findMatches(f.q, request.id, employee?.name, request.type, request.notes);
  }).sort((a, b) => {
    const column = approvalColumns[f.approvalSort];
    const value = typeof column.sort === 'function' ? column.sort : column.value;
    return f.approvalOrder * approvalCollator.compare(value(a), value(b));
  });
}

function drawIcons() {
  for (const mount of $$('[data-icon]:not(.glyph)')) {
    const name = mount.dataset.icon;
    const path = paths[name];
    if (!path) continue;
    let mask = iconMasks.get(name);
    if (!mask) {
      const canvas = document.createElement('canvas');
      canvas.width = 48;
      canvas.height = 48;
      const context = canvas.getContext('2d');
      context.scale(2, 2);
      context.lineWidth = 1.7;
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.stroke(new Path2D(path));
      mask = `url("${canvas.toDataURL()}")`;
      iconMasks.set(name, mask);
    }
    const shape = document.createElement('span');
    shape.className = 'glyph-image';
    shape.setAttribute('aria-hidden', 'true');
    shape.style.setProperty('--glyph-mask', mask);
    mount.classList.add('glyph');
    mount.append(shape);
  }
}

  const normalize = (value) => String(value || '').normalize('NFKC').toLocaleLowerCase('ar').replace(/[\u064B-\u065F\u0670ـ]/g, '').replace(/[أإآ]/g, 'ا');
  return values.some((value) => normalize(value).includes(normalize(search).trim()));
};

function person(id, showId = false) {

  return `<span class="person"><span class="avatar" aria-hidden="true">${escape(initials(employee.name))}</span><span><strong>${escape(employee.name)}</strong>${showId ? `<small dir="ltr">${escape(id)}</small>` : ''}</span></span>`;
}

function table(headers, rows, options = {}) {
  if (!rows.length) return empty(options.empty);
  return `<div class="table-wrap" tabindex="0" role="region" aria-label="${escape(options.label || 'جدول البيانات')}"><table>
    <thead><tr>${headers.map((header) => `<th scope="col">${escape(header)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((row) => `<tr>${row.map((value) => `<td>${value}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function select(name, label, options, value = '', mode = '', required = false) {
  return `<div class="select"><select name="${name}" aria-label="${escape(label)}" ${mode} ${required ? 'required' : ''}>${options.map((option) => {
    const [id, text] = Array.isArray(option) ? option : [option, option];
    return `<option value="${escape(id)}" ${String(id) === String(value) ? 'selected' : ''}>${escape(text)}</option>`;
  }).join('')}</select></div>`;
}
function field(label, control, hint = '', wide = false) {

}
function tabList(name, options, current, action) {
  return `<div class="tabs" role="group" aria-label="${escape(name)}">${options.map(([value, label]) => `<button type="button" class="tab ${value === current ? 'active' : ''}" data-action="${action}" data-value="${escape(value)}" aria-pressed="${value === current}">${escape(label)}</button>`).join('')}</div>`;
}
function pageSlice(records, f, size = 7) {
  const count = Math.max(1, Math.ceil(records.length / size));
  const current = Math.max(1, Math.min(count, f.p || 1));
  const offset = (current - 1) * size;
  const controls = count > 1 ? `<div class="row-actions">${iconButton('الصفحة السابقة', `data-action="paginate" data-value="${current - 1}" ${current === 1 ? 'disabled' : ''}`, 'back')}${iconButton('الصفحة التالية', `data-action="paginate" data-value="${current + 1}" ${current === count ? 'disabled' : ''}`, 'next')}</div>` : '';
  return { items: records.slice(offset, offset + size), footer: `<div class="pager"><span>${records.length ? `عرض ${number.format(offset + 1)} إلى ${number.format(Math.min(offset + size, records.length))} من ${number.format(records.length)}` : '0 نتائج'}</span>${controls}</div>` };
}

function navigate(id, filter, slug = '') {

  const route = readRoute(hash);
  if (!route) return;
  if (location.hash !== hash) history.pushState(null, '', hash);
  displayRoute(route, filter);
}

function displayRoute({ id, slug }, filter) {

      resetApprovalFilters(f, value);
      f.requestScope = 'approvals';
    }
    Object.assign(f, { q: '', p: 1, [key]: value });

function closeMenu() {

function sectionControl(id) {

function closeSection(restoreFocus = false) {
  const trigger = expandedSection ? sectionControl(expandedSection) : null;
  trigger?.setAttribute('aria-expanded', 'false');
  sectionMenu.hidden = true;
  expandedSection = '';
  if (restoreFocus) trigger?.focus({ preventScroll: true });
}
function openSection(id, trigger) {
  const groups = navigationGroups[id];
  if (!groups) return;
  if (expandedSection === id) {
    closeSection();
    return;
  }
  closeSection();
  expandedSection = id;
  trigger.setAttribute('aria-expanded', 'true');
  $('#section-menu-title').textContent = pages[id][0];
  const content = $('#section-links');
  content.innerHTML = groups.map(([label, glyph, links]) => `<section class="section-group">
    <h3>${icon(glyph)}${escape(label)}</h3>
    ${links.map(([slug, title]) => `<a class="section-link" href="#${id}/${slug}" data-branch ${id === page && slug === branchId ? 'aria-current="page"' : ''}><span>${escape(title)}</span>${icon('next')}</a>`).join('')}
  </section>`).join('');
  sectionMenu.hidden = false;
  content.scrollTop = 0;
  drawIcons();
  const target = $('[aria-current="page"]', content) || $('.section-link', content);
  target?.focus({ preventScroll: true });
  if (target?.hasAttribute('aria-current')) target.scrollIntoView({ block: 'nearest' });
}
function renderNavigation() {
  const groups = menuGroups.map(([title, ids]) => `<section class="nav-group"><h2 class="nav-label">${escape(title)}</h2>${ids.map((id) => {
    const [label, glyph] = pages[id];
    const groups = navigationGroups[id];
    const link = groups ? `data-section="${id}" aria-controls="section-menu" aria-expanded="false"` : `data-nav="${id}"`;
    return `<button type="button" class="nav-link" ${link} aria-label="${escape(label)}" ${id === page ? 'aria-current="page"' : ''}><span class="nav-emblem">${icon(glyph)}</span><span class="nav-title">${escape(label)}</span>${groups ? `<span class="nav-chevron">${icon('next')}</span>` : ''}</button>`;
  }).join('')}</section>`);
  const navigation = $('#navigation');
  const previous = $('.nav-main', navigation)?.scrollTop || 0;
  navigation.innerHTML = `<div class="nav-main">${groups.slice(0, -1).join('')}</div><div class="nav-bottom">${groups.at(-1)}</div>`;
  $('.nav-main', navigation).scrollTop = previous;
}

function showDialog(title, body, subtitle = '') {
  closeMenu();
  nextData = null;
  $('#dialog-title').textContent = title;
  $('#dialog-subtitle').textContent = subtitle;
  $('#dialog-subtitle').hidden = !subtitle;
  $('#dialog-body').innerHTML = body;
  if (!dialog.open) dialog.showModal();
  drawIcons();
  const target = $('#dialog-body input:not([type="hidden"]), #dialog-body select') || $('#dialog-body button') || $('.dialog-header button');
  target?.focus({ preventScroll: true });
}

function presentForm(title, subtitle, markup, submit, handler) {
  showDialog(title, `<form id="dialog-form"><div class="form-grid">${markup}</div><p class="form-error" role="alert" hidden></p>
    <div class="form-actions"><button type="submit" class="button">${escape(submit)}</button>${btn('إلغاء', 'data-action="close-dialog"', 'secondary')}</div>

  nextData = handler;
}

function requestForm() {
  const form = [
    field('الموظف', select('employee', 'الموظف', employeeOptions(), 'EMP-1001', '', true)),
    field('نوع الطلب', select('type', 'نوع الطلب', leaveTypes, leaveTypes[0], 'data-form-change="request-type"', true)),

    `<div id="request-hours" hidden>${field('عدد الساعات', input('hours', 1, 'number', 'min="0.5" max="8" step="0.5"'), 'للمغادرة القصيرة في يوم واحد')}</div>`,
    field('الملاحظات', textarea('notes'), '', true),
    '<p class="callout field wide" id="request-duration" aria-live="polite"></p>',
  ];
  presentForm('طلب إجازة أو مغادرة', 'يظهر الطلب في قائمة الموافقات بعد تقديمه.', form.join(''), 'تقديم الطلب', (data) => {
    const who = getPerson(data.employee);
    const days = daysBetween(data.start, data.end);
    if (!who || who.status !== 'نشط') return 'اختر موظفًا نشطًا.';
    if (!Number.isFinite(days) || days < 1) return 'يجب أن يكون تاريخ النهاية في تاريخ البداية أو بعده.';
    const short = data.type === 'مغادرة قصيرة';
    if (short && days !== 1) return 'المغادرة القصيرة تُسجل في يوم واحد.';
    const amount = short ? Number(data.hours) : days;
    if (short && !(amount >= .5 && amount <= 8)) return 'أدخل مدة بين نصف ساعة وثماني ساعات.';
    if (data.type === 'إجازة سنوية' && amount > who.balance) return 'المدة تتجاوز رصيد الإجازة السنوية المتاح.';
    const overlaps = state.requests.some((row) => approvalFamily(row) === 'leave' && row.employee === who.id && row.status !== 'مرفوض' && data.start <= row.end && data.end >= row.start);
    if (overlaps) return 'يوجد طلب لهذا الموظف ضمن الفترة المحددة.';
    delete data.hours;
    const now = new Date().toISOString();
    state.requests.unshift({ ...data, id: newId('REQ', state.requests), family: 'leave', submitted: now, received: now, amount, status: 'قيد المراجعة' });
    state.noticesSeen = false;
    if (page === 'requests') {
      const f = settingsObj();
      resetApprovalFilters(f, 'قيد المراجعة');
      f.requestScope = 'approvals';
      f.approvalFamily = 'leave';
    }
    closeAndCommit('تم تقديم الطلب وأضيف إلى قائمة الموافقات');
  });
  updateRequestDuration();
}

function updateRequestDuration() {
  const form = $('#dialog-form');
  const message = $('#request-duration', form || dialog);
  if (!message) return;
  const controls = form.elements;
  const short = controls.type.value === 'مغادرة قصيرة';
  $('#request-hours', form).hidden = !short;
  controls.hours.disabled = !short;
  controls.hours.required = short;
  const days = daysBetween(controls.start.value, controls.end.value);
  const amount = short ? Number(controls.hours.value) : days;
  const who = getPerson(controls.employee.value);
  const duration = Number.isFinite(amount) && amount > 0 ? `المدة: ${number.format(amount)} ${short ? 'ساعة' : 'يوم'}` : 'حدد فترة صحيحة.';
  message.textContent = who && controls.type.value === 'إجازة سنوية' ? `${duration} · الرصيد المتاح ${number.format(who.balance)} يومًا` : duration;
}

function overrideForm(id) {
  const fields = field('القرار', select('decision', 'القرار', [['معتمد', 'اعتماد'], ['مرفوض', 'رفض']])) +
    field('سبب التجاوز', `<textarea name="reason" required minlength="3" maxlength="500"></textarea>`, '', true);
  presentForm('تجاوز الموافقة في النموذج', 'يُحفظ السبب مع قرار الطلب التجريبي.', fields, 'حفظ القرار', (data) => {
    if (data.reason.length < 3) return 'أدخل سبب التجاوز.';
    return reviewRequest(id, data.decision, data.reason);
  });

function reviewRequest(id, status, reason = '') {
  if (!['معتمد', 'مرفوض'].includes(status)) return 'حدد القرار.';
  const request = state.requests.find((row) => row.id === id);
  if (!request || request.status !== 'قيد المراجعة') return 'الطلب غير متاح للمراجعة.';
  const employee = getPerson(request.employee);
  const annual = approvalFamily(request) === 'leave' && request.type === 'إجازة سنوية' && status === 'معتمد';
  if (annual && (!employee || employee.status !== 'نشط' || employee.balance < request.amount)) {
    const message = 'تعذّر الاعتماد لأن الرصيد المتاح غير كافٍ أو لأن الموظف غير نشط.';
    if (reason) return message;
    return toast(message);
  }
  if (annual) employee.balance -= request.amount;
  request.status = status;
  if (reason) request.overrideReason = reason;
  closeAndCommit(status === 'معتمد' ? 'تم اعتماد الطلب' : 'تم رفض الطلب');
}

function clock(action) {
  const own = getPerson('EMP-1001');
  const now = clockFormat.format(new Date());
  const current = activeToday();
  if (action === 'clock-in') {
    if (own?.status !== 'نشط' || current?.in || current?.status === 'إجازة') return toast('التسجيل غير متاح لهذا الموظف اليوم.');
    if (!current) {
      state.attendance.unshift({ id: newId('ATT', state.attendance), employee: own.id, date: today, in: now, out: '', status: 'حضور' });
    } else {
      Object.assign(current, { in: now, out: '', status: 'حضور' });
    }
    commit('تم تسجيل الحضور');
  } else {
    if (!current?.in || current.out) return;
    if (now < current.in) return toast('وقت الانصراف الآن يسبق بداية الدوام المسجلة.');
    current.out = now;
    commit('تم تسجيل الانصراف');
  }
}

    });

    if (page === 'payroll') settingsObj().month = data.month;
    closeAndCommit(`تم احتساب ${draft.length} قسيمة تجريبية`);

function updateSearch(query) {
  const destinations = Object.entries(pages).filter(([, [label]]) => findMatches(query, label));
  const people = query.trim() ? state.people.filter((employee) => findMatches(query, employee.name, employee.id)).slice(0, 10) : [];
  const subpages = query.trim() ? Object.entries(branchesByPage).flatMap(([id, entries]) => Object.values(entries)
    .filter(([, title]) => findMatches(query, title)).map(([slug, title]) => [id, slug, title])).slice(0, 16) : [];
  $('#global-results').innerHTML = [...destinations.map(([id, [label, glyph]]) => `<button type="button" class="search-result" data-nav="${id}">${icon(glyph)}${escape(label)}</button>`),
    ...subpages.map(([id, slug, title]) => `<a class="search-result" href="#${id}/${slug}" data-branch>${icon(pages[id][1])}${escape(title)}</a>`),
    ...people.map((employee) => `<button type="button" class="search-result" data-action="employee-detail" data-id="${employee.id}">${icon('people')}${escape(employee.name)} <small dir="ltr">${employee.id}</small></button>`)].join('') || empty();
  drawIcons();
}

function notifications() {
  const pending = state.requests.filter((row) => row.status === 'قيد المراجعة');
  state.noticesSeen = true;
  commit();
  showDialog('الإشعارات', pending.length ? `<div class="tasks">${pending.slice(0, 6).map((request) => `<div class="task-line"><span class="tile-icon">${icon('requests')}</span>
    <div><strong>${escape(request.type)}</strong><small>${escape(personName(request.employee))} · ${reqPeriod(request)}</small></div>
    ${btn('عرض', `data-action="request-detail" data-id="${request.id}"`, 'secondary small')}</div>`).join('')}</div>` : empty('لا توجد طلبات تحتاج مراجعة.'), 'الطلبات المعلقة في مساحة العرض.');
}

function exportReport() {
  const f = settingsObj();
  const report = reportData(f.report, f.department);
  downloadCsv(report.headers, report.rows, `madar-${f.report}`);
}

function downloadCsv(headers, rows, filename) {
  if (!rows.length) return toast('لا توجد نتائج للتنزيل.');
  const csvCell = (value) => {
    const clean = typeof value === 'string' && /^[\s]*[=+\-@\t\r]/.test(value) ? "'" + value : String(value ?? '');
    return '"' + clean.replaceAll('"', '""') + '"';
  };
  const blob = new Blob(['\ufeff', [headers, ...rows].map((row) => row.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `${filename}.csv`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  toast('تم تجهيز التقرير للتنزيل');
}

function closeAndCommit(message) {
  if (dialog.open) dialog.close();
  commit(message);
}

function pickViewFilter(key, value, action) {
  Object.assign(settingsObj(), { [key]: value, p: 1 });
  render();
  const selected = $$(`[data-action="${action}"]`, main).find((control) => control.dataset.value === value);
  selected?.focus({ preventScroll: true });
}

const actions = {
  menu: () => { document.body.classList.add('nav-open'); $('#nav-backdrop').hidden = false; $('.mobile-menu').setAttribute('aria-expanded', 'true'); $('.nav-link[aria-current]')?.focus(); },
  'close-nav': closeMenu,
  'close-section': () => closeSection(true),
  'close-dialog': () => dialog.close(),
  search: globalSearch,
  notifications,
  'new-employee': () => employeeForm(),
  'edit-employee': ({ id }) => employeeForm(id),
  'employee-detail': ({ id }) => employeeDetails(id),
  'new-request': requestForm,
  'request-detail': ({ id }) => requestDetails(id),
  'override-request': ({ id }) => overrideForm(id),
  'pending-requests': () => navigate('requests', ['tab', 'قيد المراجعة']),
  'request-category': ({ value }) => {
    settingsObj().type = '';
    pickViewFilter('approvalFamily', value, 'request-category');
  },
  'request-scope': ({ value }) => {
    const f = settingsObj();
    if (f.requestScope === value) return;
    resetApprovalFilters(f, value === 'approvals' ? 'قيد المراجعة' : '');
    pickViewFilter('requestScope', value, 'request-scope');
  },
  'approval-sidebar': () => {
    const f = settingsObj();
    f.approvalCollapsed = !f.approvalCollapsed;
    render();
    $('[data-action="approval-sidebar"]', main)?.focus({ preventScroll: true });
  },
  'approval-column-move': ({ id, value }) => moveApprovalColumn(id, value),
  'approval-columns-reset': () => saveApprovalColumns(null, '[data-action="approval-columns-reset"]'),
  'approval-export': exportApprovals,
  'approval-new': ({ value }) => openApprovalCreation(value),
  'approval-decision': ({ id, value }) => confirmApprovalDecision(id, value),
  'approval-sort': ({ value }) => {
    const f = settingsObj();
    f.approvalOrder = f.approvalSort === value ? -f.approvalOrder : 1;
    pickViewFilter('approvalSort', value, 'approval-sort');
  },
  'task-scope': ({ value }) => pickViewFilter('taskScope', value, 'task-scope'),
  'dashboard-scope': ({ value }) => pickViewFilter('dashboardScope', value, 'dashboard-scope'),
  'home-balance-offset': ({ value }) => {
    settingsObj().balanceOffset = Number(value);
    render();
    focusHomeControl('[data-action="home-balance-offset"]:enabled');
  },
  'home-schedule': homeSchedule,
  'home-clock-log': homeClockLog,
  'home-own-tasks': () => navigate('tasks', ['taskScope', 'mine']),
  'home-jobs': () => navigate('employees', null, 'internal-jobs'),
  'home-job-detail': ({ index }) => homeJobDetail(index),
  'home-calendar-month': ({ value }) => moveHomeMonth(value),
  'home-calendar-day': ({ value }) => updateHomeCalendar(value),
  'home-calendar-today': () => updateHomeCalendar(today),
  'home-new-event': () => createHomeRecord('events'),
  'home-event-detail': ({ id }) => homeRecordDetails('events', id),
  'home-new-announcement': () => createHomeRecord('announcements'),
  'home-announcement-detail': ({ id }) => homeRecordDetails('announcements', id),
  'smart-scope': ({ value }) => pickViewFilter('smartScope', value, 'smart-scope'),
  'integration-scope': ({ value }) => pickViewFilter('integrationScope', value, 'integration-scope'),
  'learn-employees': () => navigate('employees', null, 'directory'),
  'learn-payroll': () => navigate('payroll', null, 'batches'),
  'branch-details': ({ index }) => {
    const spec = currentBranch();
    const [headers, rows] = branchData(spec[2]);
    const row = rows[Number(index)];
    if (row) presentDetails(row[0], headers.slice(1).map((label, i) => [label, row[i + 1]]), '', spec[1]);
  },
  'export-branch': () => {
    const { headers, rows } = currentBranchRows(settingsObj());
    downloadCsv(headers, rows.map(({ record }) => record), `madar-${page}-${branchId}`);
  },
  'clear-request-filters': () => {
    resetApprovalFilters(settingsObj());
    render();
    $('[data-filter="q"]', main)?.focus({ preventScroll: true });
  },
  approve: ({ id }) => reviewRequest(id, 'معتمد'),
  reject: ({ id }) => reviewRequest(id, 'مرفوض'),
  'clock-in': () => clock('clock-in'),
  'clock-out': () => clock('clock-out'),
  'new-attendance': attendanceForm,
  'attendance-detail': ({ id }) => attendanceDetails(id),
  'new-payroll': payrollForm,
  'payroll-detail': ({ id }) => payrollDetails(id),
  'new-item': ({ collection }) => collectionForm(collection),
  'edit-item': ({ collection, id }) => collectionForm(collection, id),
  'item-detail': ({ collection, id }) => collectionDetails(collection, id),
  'task-toggle': ({ id }) => toggleTask(id, true),
  paginate: ({ value }) => { settingsObj().p = Number(value); render(); },
  integration: ({ id }) => {
    if (!Object.hasOwn(state.integrations, id)) return;
    state.integrations[id] = !state.integrations[id];
    commit(state.integrations[id] ? 'تم تفعيل حالة الربط التجريبية' : 'تم إيقاف حالة الربط التجريبية');
  },
  export: exportReport,
  'reset-demo': () => showDialog('استعادة بيانات البداية', `<p>ستُستبدل التعديلات المحفوظة في هذا المتصفح بالبيانات التجريبية الأولى.</p>
    <div class="form-actions">${btn('استعادة البيانات', 'data-action="confirm-reset"', 'danger')}${btn('إلغاء', 'data-action="close-dialog"', 'secondary')}</div>`),
  'confirm-reset': () => { state = sampleData(); Object.keys(filters).forEach((key) => delete filters[key]); closeAndCommit('تم استعادة بيانات البداية'); },
};

function updateFilter(control) {
  const f = settingsObj();
  const key = control.dataset.filter;
  if (key === 'month' && !control.value) return;
  if (key === 'balanceDay' && !control.validity.valid) {
    control.value = f.balanceDay;
    return;
  }
  Object.assign(f, { [key]: control.value, p: 1 });
  const focused = document.activeElement === control;
  const selection = key === 'q' ? [control.selectionStart, control.selectionEnd] : null;
  render();
  if (focused) {
    const replacement = $(`[data-filter="${key}"]`);
    replacement?.focus({ preventScroll: true });
    if (selection && replacement) replacement.setSelectionRange(...selection);
  }
}

document.addEventListener('click', (event) => {
  if (!sidebar.contains(event.target)) closeSection();
  if (page === 'requests') dismissApprovalMenus(event.target);
  const branchLink = event.target.closest('a[data-branch]');
  if (branchLink && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey && event.button === 0) {
    const route = readRoute(branchLink.hash);
    if (route) {
      event.preventDefault();
      navigate(route.id, null, route.slug);
    }
    return;
  }
  const control = event.target.closest('button[data-nav], button[data-action], button[data-section]');
  if (!control || control.disabled) return;
  if (control.dataset.section) openSection(control.dataset.section, control);
  else if (control.dataset.nav) navigate(control.dataset.nav);
  else if (Object.hasOwn(actions, control.dataset.action)) actions[control.dataset.action](control.dataset);
});
drawerLayout.addEventListener('change', closeMenu);
document.addEventListener('input', (event) => {
  const control = event.target;
  if (control.id === 'global-query') updateSearch(control.value);
  if (control.dataset.filter === 'q' && !event.isComposing) updateFilter(control);
  if (control.form?.id === 'dialog-form') updateRequestDuration();
});
document.addEventListener('change', (event) => {
  const control = event.target;
  if (control.dataset.approvalColumn) toggleApprovalColumn(control);
  if (control.dataset.filter && control.dataset.filter !== 'q') updateFilter(control);
  if (control.dataset.task) toggleTask(control.dataset.task, control.checked);
  if (control.form?.id === 'dialog-form') updateRequestDuration();
});
document.addEventListener('toggle', ({ target }) => {
  const key = target.dataset?.approvalDisclosure;
  if (page === 'requests' && key && target.isConnected) settingsObj()[key] = target.open;
}, true);
document.addEventListener('submit', (event) => {
  const form = event.target;
  if (!['dialog-form', 'app-settings'].includes(form.id)) return;
  event.preventDefault();
  const data = Object.fromEntries([...new FormData(form)].map(([key, value]) => [key, String(value).trim()]));
  if (form.id === 'dialog-form') {
    const error = nextData?.(data);
    if (error) alertForm(form, error);
    return;
  }
  if (!data.company || !data.branch || data.end <= data.start) {
    alertForm(form, 'أدخل اسم المنشأة والفرع وحدد نهاية عمل بعد البداية.');
    return;
  }
  state.settings = { ...data, annual: Number(data.annual) };
  commit('تم حفظ الإعدادات');
});
document.addEventListener('keydown', (event) => {
  if (handleHomeCalendarKey(event)) return;
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    globalSearch();
  }
  if (event.key === 'Escape' && !dialog.open) {
    const menu = page === 'requests' && $('details[data-approval-disclosure][open]', main);
    if (menu) {
      dismissApprovalMenus(document.body);
      $('summary', menu)?.focus({ preventScroll: true });
      return;
    }
    if (expandedSection) closeSection(true);
    else if (document.body.classList.contains('nav-open')) {
      closeMenu();
      $('.mobile-menu').focus();
    }
  }
});
window.addEventListener('hashchange', () => {
  const route = readRoute(location.hash);
  if (route && (route.id !== page || route.slug !== branchId)) displayRoute(route);
});

render();
</script>
